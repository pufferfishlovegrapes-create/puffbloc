services:
  puffbloc:
    build:
      context: .
      dockerfile: Dockerfile
    image: puffbloc:latest
    container_name: puffbloc
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      WEB_PASSWORD: "${WEB_PASSWORD:?Set WEB_PASSWORD in .env}"
      SCREEN_RESOLUTION: "${SCREEN_RESOLUTION:-1280x720}"
      DRI_RENDER_NODE: "${DRI_RENDER_NODE:-}"
    shm_size: "1gb"
    restart: unless-stopped
    volumes:
      - puffbloc-flatpak:/home/ubuntu/.local/share/flatpak
      - puffbloc-data:/home/ubuntu/.var/app

volumes:
  puffbloc-flatpak:
  puffbloc-data:
