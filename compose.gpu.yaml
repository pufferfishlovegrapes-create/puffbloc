# Optional Intel/AMD GPU passthrough on a Linux Docker host.
# Find the render group with: stat -c '%g' /dev/dri/renderD128
# Then run: RENDER_GID=<number> docker compose -f compose.yaml -f compose.gpu.yaml up -d --build
services:
  puffbloc:
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:?Set RENDER_GID to the host render-node group ID}"
